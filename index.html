<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>bluefire.studios</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <!-- wallpaper-->
         <img src="assets/wallpaper.png" id="wallpaper" alt="wallpaper" draggable="false">
        <!-- like lockscreen pseudo-->
         <div id="lock-bgblur"></div>
         <div id="lock-overlay" align="center">
            
            <h1 id="timeEl">hh:mm</h1>
            <h3 id="dateEl">hh:mm</h3>
            <p id="lock-text">Click to unlock</p>
         </div>

         <!-- ABOUTME.txt-->

         <div id="aboutme-icon">
            <div id="aboutme-icon-img" align="center" justify="center">
                <h2 id="aboutme-icon-emoji">📄</h2>
                <p id="aboutme-icon-text">ABOUTME.txt</p>
            </div>
         </div>

         <div id="dock">
            <nav id="dock-nav">
                <a href="https://github.com/THEbluefirestudios"></a> <!-- placeholders   -->
                <a href="https://twitter.com/BlueFireStudios">Twitter</a>
                <a href="https://www.instagram.com/BlueFireStudios">Instagram</a>
            </nav>
         </div>
    </body>
</html>
